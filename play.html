<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c2028"><title>Играть — Три лавки</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#1c2028;color:#edf0f5;font:14px system-ui,sans-serif}header{height:64px;display:flex;align-items:center;gap:22px;padding:10px 24px;border-bottom:1px solid #424957}a{color:#b6c7f2;text-underline-offset:4px}strong{font-weight:500;flex:1}iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#1c2028}a:focus-visible,button:focus-visible{outline:3px solid #b6c7f2;outline-offset:3px}button{font:inherit;color:#edf0f5;background:transparent;border:1px solid #424957;padding:9px 12px;border-radius:6px;cursor:pointer;min-height:42px}.error{padding:40px;max-width:700px;line-height:1.7}@media(max-width:650px){header{height:96px;flex-wrap:wrap;gap:6px 16px;padding:9px 15px;font-size:12px}strong{order:3;flex-basis:100%}iframe{height:calc(100dvh - 96px)}button{margin-left:auto;font-size:12px}.direct{display:none}}</style></head><body><header><a href="index.html#games">← Все игры</a><strong id="label">Лавка зелий</strong><a class="direct" id="direct" href="index.html">Открыть отдельно</a><button id="full" type="button">На весь экран</button></header><main id="game"></main><script>
(()=>{const params=new URLSearchParams(location.search),id=params.get('game'),round=params.get('round'),edition=params.get('edition'),original=edition==='original',golf=round==='golf',home=golf?'golf.html':'index.html',models={A:'gpt-6-astra',B:'gpt-6.1-terra',C:'gpt-6.1-sol'},host=document.getElementById('game');document.querySelector('header>a').href=home+'#games';if(!Object.hasOwn(models,id)||(round!==null&&round!=='golf')||(edition!==null&&edition!=='original')){host.innerHTML='<p class="error">Такого варианта нет. <a href="'+home+'#games">Выбери игру на главной странице.</a></p>';document.getElementById('full').hidden=true;document.getElementById('direct').hidden=true;return}const url=(original?'games/'+(golf?'golf/':''):'games/audio/'+(golf?'golf/':'potions/'))+id+'/index.html';document.getElementById('label').textContent='Вариант '+id+(params.get('blind')==='1'?'':' · '+models[id]);document.title='Вариант '+id+(original?' · исходная версия':' · со звуком')+' — Три лавки';const frame=document.createElement('iframe');frame.src=url;frame.title=(golf?'Мини-гольф':'Лавка зелий')+' — вариант '+id;frame.allowFullscreen=true;host.append(frame);document.getElementById('direct').href=url;document.getElementById('full').addEventListener('click',async()=>{if(frame.requestFullscreen){try{await frame.requestFullscreen();return}catch{}}location.href=url})})();
</script></body></html>
