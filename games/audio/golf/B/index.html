<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Лунный гольф</title><link rel="stylesheet" href="style.css"></head>
<body data-audio-key="moon_golf_audio_v1"><main class="app"><header class="top"><div><span class="eyebrow">КЛУБ ВЕЧЕРНЕЙ ИГРЫ</span><h1>Лунный гольф <span>✳</span></h1></div><button id="reset" class="reset" type="button" aria-label="Начать текущую лунку заново">↺ <span>Заново</span></button></header><div class="audio-controls"><button type="button" id="audio-toggle" aria-pressed="true">Звук: вкл</button><label for="audio-volume">Громкость</label><input id="audio-volume" type="range" min="0" max="1" step="0.05" aria-label="Громкость"></div><section class="status" aria-label="Счёт"><div><span class="label">ЛУНКА</span><strong id="hole">01 <small>/ 03</small></strong></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="right"><span class="label">УДАРЫ</span><strong id="score">0</strong></div></section><div class="field-wrap"><canvas data-golf-course aria-label="Поле для мини-гольфа. Чтобы ударить, потяните мяч в сторону, противоположную удару, и отпустите."></canvas><div id="result" class="result" hidden><div class="result-card"><span class="eyebrow">ПАРТИЯ ЗАВЕРШЕНА</span><div class="result-icon">✳</div><h2>Отличная игра!</h2><p id="summary"></p><button id="again" type="button">Ещё партию <span>↗</span></button></div></div></div><footer><div class="hint-icon">↙</div><p id="hint">Потяни мяч назад <span>и отпусти для удара</span></p><span class="par" id="par">PAR 2</span></footer><div id="announce" class="sr" aria-live="polite"></div></main><script src="audio.js"></script><script src="game.js"></script></body></html>
