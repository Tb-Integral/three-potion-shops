<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ночная оранжерея</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div class="brand"><span class="mark">✳</span><span>НОЧНАЯ <b>ОРАНЖЕРЕЯ</b></span></div><div class="sound"><button id="mute" type="button" aria-label="Выключить звук">🔊</button><label for="volume">Звук</label><input id="volume" type="range" min="0" max="100" value="45" aria-label="Громкость"></div></header><section class="frame" aria-label="Игровая арена"><canvas id="field" data-arena-field aria-label="Поле игры. Перетаскивайте палец для движения"></canvas><div class="hud" id="hud" hidden><div class="health"><span>ЗДОРОВЬЕ</span><div class="bar"><i id="healthbar"></i></div><b id="hp">100 / 100</b></div><div class="clock"><small>ОСТАЛОСЬ</small><strong id="time">1:30</strong></div><button id="pause" class="pause" type="button" aria-label="Пауза">Ⅱ</button></div><div class="hint" id="hint" hidden>WASD / стрелки · на экране — ведите пальцем</div><div class="overlay" id="overlay"></div><div class="stick" id="stick" hidden><i></i></div></section><footer><span>ВЫЖИВИТЕ 90 СЕКУНД</span><span>АВТОМАТИЧЕСКИЙ ОГОНЬ ✦</span></footer></main><script src="game.js"></script></body></html>
